exchange:
  testnet: true            # use Bybit testnet until you trust the bot
  market: linear           # USDT perpetuals

screener:
  min_quote_volume_usd: 20000000   # 24h turnover filter, avoids illiquid coins
  timeframe: 1h
  lookback_bars: 200
  rs_bars: 24                      # relative-strength window vs BTC
  top_n: 10
  max_universe: 80                 # cap candles fetched per scan (rate limits)
  exclude: ["USDC/USDT:USDT"]

structure:
  timeframe: 15m                   # entry timeframe
  htf: 4h                          # higher-timeframe bias
  swing_left: 3
  swing_right: 3

plan:
  sides: long              # long | short | both  (short is the exact mirror of long)
  max_stop_atr: 3.0
  min_stop_atr: 0.5
  r_multiples: [1.0, 2.0, 3.0]     # TP ladder in R
  tp_fractions: [0.4, 0.3, 0.3]
  min_room_r: 1.0                  # skip if resistance is closer than this
  round_trip_cost_pct: 0.15        # taker fee 2 x 0.055% plus slippage, in % of price
  min_stop_cost_mult: 3.0          # stop must be >= this x round-trip cost (0 disables)

risk:
  paper_equity: 1000
  risk_per_trade_pct: 0.5
  max_daily_loss_pct: 2.0
  max_open_positions: 3
  max_leverage: 3

signals:
  port: 8080
  wy_ttl_min: 240          # a Wyckoff trigger stays valid this long
  smc_ttl_min: 1440        # an SMC swing bias stays valid this long
  require_smc: true        # long needs a bullish SMC swing bias (CHoCH/BOS) too

dumb_money:
  mode: "off"              # off | veto (block longs into crowd euphoria) | require (veto + need capitulation)
                           # default off: no measurable benefit in the 1H backtest (see README)
  euphoria_bars: 6
  capitulation_bars: 12
  index_hot: 70
  index_cold: 30

dashboard:
  symbols: ["BTC/USDT:USDT", "ETH/USDT:USDT", "SOL/USDT:USDT", "ADA/USDT:USDT", "SUI/USDT:USDT"]
  watchlist: ["NEAR/USDT", "RENDER/USDT", "FET/USDT"]   # spot symbols; shown separately, NOT counted in breadth
  sma: 200
  near_pct: 3.0            # display-only: flag coins within this % of their average
  cache_seconds: 600       # refresh at most this often (exchange rate limits)
  # set env DASHBOARD_TOKEN to require ?token=... on /dashboard and /api/trend

safety:                    # Bybit perp guards, applied by LiveExecutor before and after every live entry (see cryptp/safety.py)
  isolated: true           # isolated margin only
  liq_buffer: 0.5          # stop must be within this fraction of the distance to liquidation
  mmr_pct: 0.5             # ASSUMED maintenance margin rate (% of notional): verify per symbol before going live
  max_entry_drift_pct: 0.5 # block if live price moved this far from the planned entry
  max_adverse_funding_8h_pct: 0.05   # block if this side pays more than this per 8h (baseline is 0.01)
  require_exchange_stop: true        # no stop on the exchange after entry => flatten + write KILL
